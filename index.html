<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVYAA Archery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f1f1f1;
    }

    header {
      text-align: center;
      padding: 20px;
      background-color: #1e1e1e;
    }

    header img {
      max-width: 100%;
      height: auto;
    }

    .container {
      padding: 15px;
      max-width: 900px;
      margin: auto;
    }

    .image-card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .image-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <img src="CVYAA.png" alt="CVYAA Header">
</header>

<div class="container">

  <div class="image-card">
  <img src="ibo_thur.png" alt="IBO Thursday Info">
  </div>

  <div class="image-card">
    <img src="nasp_bull.png" alt="NASP Bullseye">
  </div>

  <div class="image-card">
    <img src="centershot_bull.png" alt="Centershot Bullseye">
  </div>

  <div class="image-card">
    <img src="nasp_3d.png" alt="NASP 3D">
  </div>

  <div class="image-card">
    <img src="centershot_3d.png" alt="Centershot 3D">
  </div>

  <div class="image-card">
    <img src="map.png" alt="Map 1">
  </div>

  <div class="image-card">
    <img src="map2.png" alt="Map 2">
  </div>

    <div class="image-card">
    <h3>Gate 1 Location</h3>
    <iframe
      src="https://www.google.com/maps?q=Gate+1+Kentucky+Exposition+Center&output=embed"
      width="100%"
      height="300"
      style="border:0; border-radius:8px;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
    <p>
      <a href="https://maps.app.goo.gl/SPcBmzZG3s9XWy529" target="_blank" style="color:#4da6ff;">
        Open in Google Maps
      </a>
    </p>
  </div>

    <div class="image-card">
    <h3>Floor Plans</h3>
    <p>
      <a href="https://kyexpo.org/floor-plans/" target="_blank" style="color:#4da6ff;">
        View Kentucky Expo Center Floor Plans
      </a>
    </p>
  </div>

  <div class="image-card">
  <h3>Event Video</h3>
  <p>
    <a href="https://www.facebook.com/share/v/1EZ4hFrCgf/" target="_blank" style="color:#4da6ff;">
      Watch on Facebook
    </a>
  </p>
</div>

</div>

<footer>
  <p>© 2026 CVYAA Archery</p>
</footer>

</body>
</html>
