<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVYAA Archery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f1f1f1;
    }

    header {
      text-align: center;
      padding: 20px;
      background-color: #1e1e1e;
    }

    header img {
      max-width: 100%;
      height: auto;
    }

    .container {
      padding: 15px;
      max-width: 900px;
      margin: auto;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h2 {
      border-bottom: 2px solid #333;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .image-card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .image-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <img src="CVYAA.png" alt="CVYAA Header">
</header>

<div class="container">

  <div class="section">
    <h2>Bullseye</h2>

    <div class="image-card">
      <img src="nasp_bullseye.png" alt="NASP Bullseye">
    </div>

    <div class="image-card">
      <img src="centershot_bullseye.png" alt="Centershot Bullseye">
    </div>
  </div>

  <div class="section">
    <h2>3D</h2>

    <div class="image-card">
      <img src="nasp_3d.png" alt="NASP 3D">
    </div>

    <div class="image-card">
      <img src="centershot_3d.png" alt="Centershot 3D">
    </div>
  </div>

  <div class="section">
    <h2>Maps</h2>

    <div class="image-card">
      <img src="map.png" alt="Map 1">
    </div>

    <div class="image-card">
      <img src="map2.png" alt="Map 2">
    </div>
  </div>

</div>

<footer>
  <p>© 2026 CVYAA Archery</p>
</footer>

</body>
</html>
